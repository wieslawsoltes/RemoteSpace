name: RDP interoperability
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xrdp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build client, bridge and test security codecs
        run: |
          dotnet build apps/RemoteSpace.Bridge -c Release
          dotnet run --project tests/RemoteSpace.Integration -c Release
      - name: Install isolated interoperability server
        run: bash tools/start-test-server.sh
      - name: Connect, decode desktop, and send real keyboard input
        env:
          RDP_TEST_HOST: localhost
          RDP_TEST_USER: rdptest
        run: |
          dotnet run --project tests/RemoteSpace.Integration -c Release --no-build
          sudo test -f /home/rdptest/proof
          echo 'PASS independent server-side keyboard effect: /home/rdptest/proof'
          python3 -c "from PIL import Image; Image.open('artifacts/integration/desktop.ppm').save('artifacts/integration/desktop.png')"
      - name: Collect server diagnostics
        if: always()
        run: |
          mkdir -p artifacts/integration
          sudo cat /var/log/xrdp.log > artifacts/integration/xrdp.log || true
          sudo cat /var/log/xrdp-sesman.log > artifacts/integration/sesman.log || true
          sudo cat /home/rdptest/.xsession-errors > artifacts/integration/xsession.log || true
          cat artifacts/integration/xrdp.log
          cat artifacts/integration/sesman.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdp-interoperability
          path: artifacts/integration
  template-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inspect pinned Uno template entry points
        run: |
          dotnet new install Uno.Templates@6.7.30
          dotnet new unoapp -preset blank -o /tmp/UnoReference
          find /tmp/UnoReference -type f \( -name '*.csproj' -o -name 'Program.cs' -o -name 'App.xaml' -o -name 'App.xaml.cs' -o -name 'index.html' \) -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: uno-template-reference
          path: /tmp/UnoReference
  offline-core-tooling:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Export public SDK and source for offline validation
        shell: bash
        run: |
          mkdir -p /tmp/core-tooling/dotnet/{sdk,shared,packs} artifacts/tooling
          cp /usr/share/dotnet/dotnet /tmp/core-tooling/dotnet/
          cp -a /usr/share/dotnet/host /tmp/core-tooling/dotnet/
          cp -a "/usr/share/dotnet/sdk/$(dotnet --version)" /tmp/core-tooling/dotnet/sdk/
          for name in Microsoft.NETCore.App Microsoft.AspNetCore.App; do
            mkdir -p "/tmp/core-tooling/dotnet/shared/$name"
            cp -a /usr/share/dotnet/shared/"$name"/10.* "/tmp/core-tooling/dotnet/shared/$name/"
          done
          for name in Microsoft.NETCore.App.Ref Microsoft.AspNetCore.App.Ref Microsoft.NETCore.App.Host.linux-x64; do
            mkdir -p "/tmp/core-tooling/dotnet/packs/$name"
            cp -a /usr/share/dotnet/packs/"$name"/10.* "/tmp/core-tooling/dotnet/packs/$name/"
          done
          tar -czf artifacts/tooling/dotnet-sdk.tar.gz -C /tmp/core-tooling dotnet
          git archive --format=zip --output=artifacts/tooling/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: offline-core-tooling
          path: artifacts/tooling
          retention-days: 1
          compression-level: 0
